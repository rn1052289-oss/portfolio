<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#2a2a2a"/>
  <!-- Lacquerware motif: stylized bowl silhouette -->
  <!-- Outer rim -->
  <ellipse cx="16" cy="13" rx="10" ry="3.5" fill="none" stroke="#f2f0eb" stroke-width="1.2"/>
  <!-- Body curve (left) -->
  <path d="M6 13 Q5 22 11 25" fill="none" stroke="#f2f0eb" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Body curve (right) -->
  <path d="M26 13 Q27 22 21 25" fill="none" stroke="#f2f0eb" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Base line -->
  <line x1="11" y1="25" x2="21" y2="25" stroke="#f2f0eb" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Accent dot — vermilion -->
  <circle cx="16" cy="13" r="1.8" fill="#8b1a1a"/>
</svg>
